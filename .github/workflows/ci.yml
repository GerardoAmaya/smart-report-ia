name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Para lanzar a mano las pruebas extremo a extremo, que no corren solas.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: smart_report
          POSTGRES_PASSWORD: smart_report
          POSTGRES_DB: smart_report
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smart_report"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql+psycopg://smart_report:smart_report@localhost:5432/smart_report
      ENVIRONMENT: ci
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: smart-report-photos
      S3_ACCESS_KEY_ID: smart_report_minio
      S3_SECRET_ACCESS_KEY: smart_report_minio_dev_only

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - name: Almacenamiento de objetos
        # MinIO como paso y no como service: la imagen pide el argumento
        # "server", y services no deja cambiar el comando comodamente. Sin esto
        # la fase 2 no tendria cobertura en CI, que es donde importa.
        #
        # **No se crea el bucket aqui.** La suite crea el suyo —con sufijo
        # -test, porque el almacenamiento tambien esta aislado— asi que un paso
        # que lo creara seria una pieza de mas que puede fallar. Ya fallo: se
        # invocaba `mc` con `/bin/sh -c`, y como `mc` es el entrypoint de esa
        # imagen, recibia "/bin/sh" como subcomando y reventaba.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=smart_report_minio \
            -e MINIO_ROOT_PASSWORD=smart_report_minio_dev_only \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

          # Esperar a que conteste, no a que el contenedor exista: arrancado no
          # es lo mismo que listo, y la primera prueba fallaria por carrera.
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e ".[dev]"

      - run: ruff check .
      - run: ruff format --check .

      - name: Migraciones en ambas direcciones
        # Una migracion que sube pero no baja se descubre el dia que hay que
        # revertir en produccion. Se comprueba en cada commit.
        #
        # **Contra la base que crea la imagen de PostGIS**, no contra una
        # creada a mano: la imagen instala cinco extensiones y una base recien
        # creada con CREATE DATABASE trae solo la que pone la migracion. La
        # bajada de 0001 fallaba unicamente en la primera, asi que comprobarlo
        # en la segunda daba verde sobre una base que no se parece a esta.
        run: |
          psql "$DATABASE_URL_PSQL" -tAc \
            "SELECT string_agg(extname, ', ' ORDER BY extname) FROM pg_extension;"
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
        env:
          DATABASE_URL_PSQL: postgresql://smart_report:smart_report@localhost:5432/smart_report

      - name: Seeders
        # Idempotentes por contrato: correrlos dos veces tiene que dejar lo
        # mismo. Si eso se rompe, se descubre aca y no en un despliegue.
        run: |
          python -m seeders.runner
          python -m seeders.runner

      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    # **No corre en cada commit: se lanza a mano.**
    #
    # La clasificacion es parte del camino que se prueba, asi que cada corrida
    # llama al modelo de verdad. Son centavos, pero centavos en cada empujon a
    # una rama, y este es un proyecto con saldo contado. Se lanza desde la
    # pestaña Actions cuando se quiera comprobar el sistema entero, y en local
    # con `make e2e` sin pedirle permiso a nadie.
    if: github.event_name == 'workflow_dispatch'

    # Extremo a extremo **contra el sistema levantado**, no contra
    # simulaciones. Es lo que PLAN.md exige para dar la fase 7 por terminada:
    # una prueba que simula la API comprueba que el frontend se entiende
    # consigo mismo, no que el sistema funciona.
    #
    # Se levanta todo con compose —incluido un Telegram falso, para no
    # necesitar una cuenta ni fotos reales— y Playwright lo usa tal cual.
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configuracion
        # Los secretos se generan en la corrida: estas pruebas no hablan con
        # Telegram ni con Google de verdad, asi que no hacen falta credenciales
        # reales. La del modelo si, porque la clasificacion es parte del camino.
        run: |
          cp .env.example .env
          {
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "TELEGRAM_WEBHOOK_SECRET=$(openssl rand -hex 32)"
            echo "TELEGRAM_BOT_TOKEN=000:ci"
            echo "DEMO_PASSWORD=$(openssl rand -hex 12)"
            echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"
          } >> .env

      - name: Levantar el sistema
        run: make e2e-up

      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Los tres recorridos
        run: make e2e args="--reporter=list"

      - name: Que paso si fallo
        if: failure()
        run: docker compose --profile e2e logs --tail 120

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
