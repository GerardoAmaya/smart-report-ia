name: smart-report-ia

services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smart_report}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_report}
      POSTGRES_DB: ${POSTGRES_DB:-smart_report}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # api espera a esto: sin healthcheck, las migraciones corren contra una
      # base que todavia no acepta conexiones y el arranque falla en frio.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_report} -d ${POSTGRES_DB:-smart_report}"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smart_report}:${POSTGRES_PASSWORD:-smart_report}@db:5432/${POSTGRES_DB:-smart_report}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: http://localhost:3100
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      RELOAD: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      # El navegador corre en el host, no dentro de la red de compose: la URL
      # tiene que ser localhost y no http://api.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3100:3000"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
  web_next:
