name: smart-report-ia

services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smart_report}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_report}
      POSTGRES_DB: ${POSTGRES_DB:-smart_report}
    ports:
      # 5433 en el host y no 5432: otro proyecto de esta maquina ocupa el 5432,
      # igual que ocupa el 3000. Dentro de compose los servicios siguen
      # hablandole a db:5432, asi que esto solo afecta a un psql desde el host.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # api espera a esto: sin healthcheck, las migraciones corren contra una
      # base que todavia no acepta conexiones y el arranque falla en frio.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_report} -d ${POSTGRES_DB:-smart_report}"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smart_report}:${POSTGRES_PASSWORD:-smart_report}@db:5432/${POSTGRES_DB:-smart_report}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLASSIFY_MODEL: ${CLASSIFY_MODEL:-claude-haiku-4-5}
      CLASSIFY_IMAGE_VARIANT: ${CLASSIFY_IMAGE_VARIANT:-thumbnail}
      CORS_ORIGINS: http://localhost:3100
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@smart-report.local}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3100}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-smart-report-photos}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-smart_report_minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-smart_report_minio_dev_only}
      S3_REGION: ${S3_REGION:-us-east-1}
      RELOAD: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  # Almacenamiento de objetos local. Habla el protocolo de S3, igual que R2 al
  # desplegar: el codigo no distingue, solo cambian las variables de entorno.
  # Nada lo escribe todavia; el trabajador que sube las fotos es de la fase 2.
  minio:
    # MinIO retiro sus imagenes de Docker Hub: solo estan en quay.io.
    # Version clavada y no latest: una imagen que cambia sola convierte
    # "a mi me funciona" en una afirmacion sin fecha.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-smart_report_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-smart_report_minio_dev_only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # El bucket tiene que existir antes de la primera subida. Crearlo aca y no
  # en el arranque de la API evita que cada despliegue pida permiso de crear
  # buckets, que en R2 no queremos dar.
  minio_init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '${S3_ACCESS_KEY_ID:-smart_report_minio}' '${S3_SECRET_ACCESS_KEY:-smart_report_minio_dev_only}' &&
      mc mb --ignore-existing local/${S3_BUCKET:-smart-report-photos} &&
      mc anonymous set none local/${S3_BUCKET:-smart-report-photos}
      "

  # Trabajador de fotos. Misma imagen que la API, otro comando.
  # Aparte y no dentro de la API: ahi una descarga trabada ocuparia un hilo web,
  # y no se podria reiniciar uno sin el otro.
  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smart_report}:${POSTGRES_PASSWORD:-smart_report}@db:5432/${POSTGRES_DB:-smart_report}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLASSIFY_MODEL: ${CLASSIFY_MODEL:-claude-haiku-4-5}
      CLASSIFY_IMAGE_VARIANT: ${CLASSIFY_IMAGE_VARIANT:-thumbnail}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-smart-report-photos}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-smart_report_minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-smart_report_minio_dev_only}
      S3_REGION: ${S3_REGION:-us-east-1}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      # El navegador corre en el host, no dentro de la red de compose: la URL
      # tiene que ser localhost y no http://api.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3100:3000"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
  web_node_modules:
  web_next:
