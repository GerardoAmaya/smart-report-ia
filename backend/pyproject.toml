[project]
name = "smart-report-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]==0.165.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.9",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "geoalchemy2==0.21.0",
    "pydantic-settings==2.16.3",
    "anthropic==2.12.0",
    # PTB se usa como biblioteca, no como framework: los tipos del esquema de
    # Telegram y nada mas. El enrutado ya lo hace FastAPI.
    "python-telegram-bot==22.8",
    # Deja de ser solo de pruebas: PTB lo exige en runtime (>=0.27,<0.29).
    "httpx==0.28.1",
    # Almacenamiento de objetos. Sincrono: corre en el trabajador, fuera del
    # camino del webhook. aioboto3 clavaria una version vieja de aiobotocore.
    "boto3==1.44.7",
    # Miniaturas y validacion. Abrir la imagen comprueba mas que olfatear
    # sus primeros bytes, y ahorra libmagic como dependencia del sistema.
    # 13.0.0 y no 12.x: pip-audit encontro 42 vulnerabilidades en 12.3.0, y
    # Pillow es lo que abre fotos que manda cualquiera.
    "pillow==13.0.0",
    # Entrada con Google. Se construye el cliente al vuelo, no al importar.
    # 1.9.1: la version minima que corrige las 8 vulnerabilidades de 1.8.0.
    "authlib==1.9.10",
    # Firma la cookie de sesion de Starlette.
    "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
    # Revisa las dependencias contra la base de vulnerabilidades de PyPI. En el
    # extra de desarrollo y no en la imagen: corre en CI, no en el servidor.
    "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
# La carpeta local alembic/ hace que ruff crea que el paquete es propio.
known-third-party = ["alembic"]
